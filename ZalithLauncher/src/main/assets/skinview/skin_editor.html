<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body,#editor{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#editor{position:relative;touch-action:none}
#skin-container{position:absolute;inset:0}
#paint-layer{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hint{position:absolute;left:10px;right:10px;bottom:8px;padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.45);color:white;font:12px sans-serif;text-align:center;pointer-events:none}
canvas{display:block}
</style>
<script src="skinview3d.bundle.js"></script>
</head>
<body>
<div id="editor">
  <div id="skin-container"></div>
  <canvas id="paint-layer"></canvas>
  <div id="hint">Drag with one finger to rotate. Tap or drag on the model to paint.</div>
</div>
<script src="skin_editor.js"></script>
</body>
</html>
